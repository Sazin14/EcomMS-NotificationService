stages:
  - test
  - promote

workflow:
  rules:
    # Validate merge requests targeting main.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

    # Run pipelines only for devops and main pushes.
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "devops" || $CI_COMMIT_BRANCH == "main")'

    - when: never

variables:
  NOTIFICATION_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  GITOPS_BRANCH: "devops"
  GITOPS_DEPLOYMENT: "apps/notification/service/deployment.yaml"
  GITOPS_CONSUMERS: "apps/notification/service/order-consumer.yaml apps/notification/service/inventory-consumer.yaml"

# Build and validate the Docker image.
# Publish only from a push pipeline on main.
build_test:
  stage: test
  tags:
    - dell-local

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "devops" || $CI_COMMIT_BRANCH == "main")'

  script:
    - docker info
    - docker build --pull --platform linux/amd64 -t "$NOTIFICATION_IMAGE" .
    - docker run --rm --entrypoint php "$NOTIFICATION_IMAGE" artisan --version
    - docker run --rm --entrypoint php "$NOTIFICATION_IMAGE" artisan route:list
    # Regression checks: staff routes need the Redis extension and the middleware classes must autoload.
    - |
      docker run --rm --entrypoint php "$NOTIFICATION_IMAGE" -r 'exit(extension_loaded("redis") ? 0 : 1);'
    - |
      docker run --rm --entrypoint php "$NOTIFICATION_IMAGE" -r 'require "vendor/autoload.php"; foreach (["VerifyJwt", "CheckAuthorization", "CheckPermission", "EnsureCustomer"] as $c) { if (! class_exists("App\\Http\\Middleware\\".$c)) { fwrite(STDERR, "missing middleware $c\n"); exit(1); } }'
    - |
      set -eu

      if [ "$CI_PIPELINE_SOURCE" = "push" ] &&
         [ "$CI_COMMIT_BRANCH" = "main" ]; then
        printf '%s' "$CI_REGISTRY_PASSWORD" |
          docker login "$CI_REGISTRY" \
            -u "$CI_REGISTRY_USER" --password-stdin

        docker push "$NOTIFICATION_IMAGE"
      else
        echo "Validation only: image will not be published."
      fi

  after_script:
    - docker logout "$CI_REGISTRY" || true
    - docker image rm "$NOTIFICATION_IMAGE" || true

# Promote the successfully published image through GitOps.
# This job runs only for push pipelines on main.
promote_gitops:
  stage: promote
  tags:
    - dell-local

  needs:
    - job: build_test

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

  script:
    - |
      set -eu

      if [ -z "${GITOPS_GITHUB_TOKEN:-}" ]; then
        echo "ERROR: GITOPS_GITHUB_TOKEN is not configured."
        exit 1
      fi

      WORK_DIR="$(mktemp -d)"
      trap 'rm -rf "$WORK_DIR"' EXIT

      git clone --depth 1 --branch "$GITOPS_BRANCH" \
        "https://x-access-token:${GITOPS_GITHUB_TOKEN}@github.com/Rasiulknots/ecomms-gitops.git" \
        "$WORK_DIR/gitops"

      cd "$WORK_DIR/gitops"

      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@users.noreply.github.com"

      # Update every Notification Service image reference: API (init container + api) and both consumers.
      GITOPS_FILES="$GITOPS_DEPLOYMENT $GITOPS_CONSUMERS"
      for f in $GITOPS_FILES; do
        sed -i -E \
          "s|(image: registry\\.gitlab\\.com/ecomms1/ecomms-notificationservice:)[^[:space:]]+|\\1${CI_COMMIT_SHA}|g" \
          "$f"
        grep -n 'image:' "$f"
      done

      EXPECTED_COUNT="$(
        cat $GITOPS_FILES | grep -cF \
          "image: registry.gitlab.com/ecomms1/ecomms-notificationservice:${CI_COMMIT_SHA}" || true
      )"

      if [ "$EXPECTED_COUNT" -ne 4 ]; then
        echo "ERROR: Expected exactly four Notification Service image references; found $EXPECTED_COUNT."
        exit 1
      fi

      git add $GITOPS_FILES

      if git diff --cached --quiet; then
        echo "GitOps already references this image; no commit needed."
      else
        git commit -m "Deploy Notification Service ${CI_COMMIT_SHA}"
        git push origin "HEAD:${GITOPS_BRANCH}"
      fi
